<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Assignment 3</title>

    <style>
        body {
            margin: 0;
            font-family: "Times New Roman", serif;
        }

        h2 {
            text-align: center;
            margin: 10px 0 2px;
        }

        /* Common table styling */
        table.middle {
            width: 80%;
            margin: 0 auto 62px auto;
            border: 1px solid black;
            border-spacing: 1px;
            padding: 1px;
        }

        table.middle td,
        table.middle th {
            border: 1px solid black;
            padding: 1px;
        }

        /* Table 1 */
        #table-1 {
            height: 88px;
        }

        #table-1 .center {
            text-align: center;
        }

        #table-1 .right {
            text-align: right;
        }

        /* Table 2 */
        #table-2 {
            height: 176px;
        }

        #table-2 td {
            height: 25px;
        }

        /* Table 3 */
        #table-3 {
            height: 305px;
        }

        #table-3 .green {
            background-color: green;
            height: 25px;
        }

        #table-3 .blue {
            background-color: blue;
            height: 25px;
        }

        #t-image {
            text-align: center;
            vertical-align: middle;
        }

        #t-image img {
            width: 340px;
            height: auto;
            display: block;
            margin: auto;
        }
    </style>
</head>

<body>

    <h2>HTML Assignment #3</h2>

    <!-- TABLE 1 -->
    <table id="table-1" class="middle">
        <tbody>
            <tr>
                <td id="t11">left</td>
                <td id="t12">center</td>
                <td id="t13">right</td>
            </tr>

            <tr class="center">
                <td>left</td>
                <td>center</td>
                <td class="right">right</td>
            </tr>

            <tr>
                <td>left</td>
                <td class="center">center</td>
                <td class="right">right</td>
            </tr>
        </tbody>
    </table>


    <!-- TABLE 2 -->
    <table id="table-2" class="middle">
        <tbody>
            <!-- First row: single cell -->
            <tr>
                <td id="t21" colspan="6"></td>
            </tr>

            <!-- Remaining 5 rows -->
            <tr>
                <td rowspan="4"></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td></td>
                <td colspan="3" rowspan="2"></td>
                <td></td>
            </tr>

            <tr>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td colspan="6"></td>
            </tr>
        </tbody>
    </table>


    <!-- TABLE 3 -->
    <table id="table-3" class="middle">
        <tbody>
            <!-- Green first row -->
            <tr>
                <td colspan="3" class="green"></td>
            </tr>

            <!-- Image row -->
            <tr>
                <td></td>

                <td id="t-image">
                    <img
                        src="https://www2.d125.org/applied_arts/teched/courses/WEB/portfolios/2013_FallP3/Luthra%20Portfolio/images-1.jpeg"
                        alt="HTML Assignment Image">
                </td>

                <td></td>
            </tr>

            <!-- Blue last row -->
            <tr>
                <td colspan="3" class="blue"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
