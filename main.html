<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Assignment #3</title>

<style>
    body{
        font-family: "Times New Roman", serif;
        background:#eee;
    }

    .container{
        width:90%;
        margin:auto;
    }

    h2{
        text-align:center;
        margin-bottom:0;
    }

    table{
        border-collapse:collapse;
        width:100%;
        margin:20px 0 60px;
    }

    td,th{
        border:1px solid #000;
        padding:3px;
    }

    /* First Table */
    .table1 td{
        height:22px;
    }

    .left{
        text-align:left;
    }

    .center{
        text-align:center;
    }

    .right{
        text-align:right;
    }

    /* Second Table */
    .table2 td{
        height:22px;
    }

    .header{
        height:25px;
    }

    .footer{
        height:25px;
    }

    .side{
        width:180px;
    }

    /* Third Table */
    .table3{
        height:300px;
    }

    .green{
        background:green;
        height:25px;
    }

    .blue{
        background:blue;
        height:25px;
    }

    .image-cell{
        text-align:center;
        vertical-align:middle;
    }

    .image-cell img{
        width:340px;
        height:auto;
        border:1px solid #999;
    }
</style>
</head>
<body>

<div class="container">

    <h2>HTML Assignment #3</h2>

    <!-- Table 1 -->
    <table class="table1">
        <tr>
            <td class="left">left</td>
            <td class="center">center</td>
            <td class="right">right</td>
        </tr>
        <tr>
            <td class="left">left</td>
            <td class="center">center</td>
            <td class="right">right</td>
        </tr>
        <tr>
            <td class="left">left</td>
            <td class="center">center</td>
            <td class="right">right</td>
        </tr>
    </table>

    <!-- Table 2 -->
    <table class="table2">
        <tr>
            <td colspan="6" class="header"></td>
        </tr>

        <tr>
            <td rowspan="4" class="side"></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td></td>
            <td colspan="3" rowspan="2"></td>
            <td></td>
        </tr>

        <tr>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td colspan="6" class="footer"></td>
        </tr>
    </table>

    <!-- Table 3 -->
    <table class="table3">
        <tr>
            <td colspan="3" class="green"></td>
        </tr>

        <tr>
            <td></td>

            <td class="image-cell">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/ae/Michael_Jordan_in_2014.jpg"
                     alt="Basketball">
            </td>

            <td></td>
        </tr>

        <tr>
            <td colspan="3" class="blue"></td>
        </tr>
    </table>

</div>

</body>
</html>
